{% extends "base.html" %}

{% block title %}Register | MedInfo{% endblock %}

{% block content %}
<section class="auth-page">
    <p class="eyebrow">Create your account</p>
    <h1>Register</h1>
    <form class="auth-form" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required>
        <button type="submit">Register</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
